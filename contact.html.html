<head>

<body>
    <header>
        <nav>
            <div class="logo">Al <span>Ruya</span></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Get in touch today.</p>
    </section>

    <main>
        <section>
            <h2>Send Us a Message</h2>
            <form action="https://formspree.io/f/your-form-id" method="POST">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="contact-info">
            <h2>Other Ways to Reach Us</h2>
            <p><strong>Email:</strong> <a href="mailto:info@alruya.qa">info@alruya.qa</a></p>
            <p><strong>Phone:</strong> +974 XXXX XXXX</p>
            <p><strong>Address:</strong> Doha, Qatar</p>
        </section>
    </main>

    <footer>
        &copy; 2026 Al Ruya. All rights reserved.
    </footer>
